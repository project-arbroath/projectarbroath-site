backend:
  name: git-gateway
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Main Pages"
    files:
      - label: "Home"
        name: "home"
        file: "src/content/home.md"
        fields:
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text" }
          - { label: "Election Callout Heading", name: "election_heading", widget: "string" }
          - { label: "Election Callout Text", name: "election_text", widget: "text" }
          - { label: "Sovereignty Section Heading", name: "sovereignty_heading", widget: "string" }
          - { label: "Sovereignty Section Intro", name: "sovereignty_intro", widget: "text" }
          - { label: "Voting System Heading", name: "voting_heading", widget: "string" }
          - { label: "Voting System Intro", name: "voting_intro", widget: "text" }
          - { label: "Booklet Section Heading", name: "booklet_heading", widget: "string" }
          - { label: "Booklet Section Text", name: "booklet_text", widget: "text" }
          - { label: "Booklet Quote", name: "booklet_quote", widget: "text" }

      - label: "Sovereignty"
        name: "sovereignty"
        file: "src/sovereignty.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body Content", name: "body", widget: "markdown" }

  - name: "holyrood"
    label: "Holyrood 2026"
    files:
      - label: "Overview"
        name: "elections"
        file: "src/holyrood/index.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body Content", name: "body", widget: "markdown" }

      - label: "The Second Vote"
        name: "second-vote"
        file: "src/holyrood/second-vote.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body Content", name: "body", widget: "markdown" }

      - label: "Video Explainers"
        name: "explainers"
        file: "src/holyrood/explainers.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body Content", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Global Settings"
        name: "settings"
        file: "src/content/settings.md"
        fields:
          - { label: "Contact Email", name: "contact_email", widget: "string" }
          - { label: "Calculator URL", name: "calculator_url", widget: "string" }
