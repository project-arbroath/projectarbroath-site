backend:
  name: github
  repo: project-arbroath/projectarbroath-site
  branch: main

media_folder: "assets/images"
public_folder: "/assets/images"

collections:
  - name: "pages"
    label: "Main Pages"
    files:
      - label: "Home"
        name: "home"
        file: "content/home.md"
        fields:
          - { label: "Hero Title", name: "hero_title", widget: "string" }
          - { label: "Hero Subtitle", name: "hero_subtitle", widget: "text" }
          - { label: "Election Callout Heading", name: "election_heading", widget: "string" }
          - { label: "Election Callout Text", name: "election_text", widget: "text" }
          - { label: "Sovereignty Section Heading", name: "sovereignty_heading", widget: "string" }
          - { label: "Sovereignty Section Intro", name: "sovereignty_intro", widget: "text" }
          - { label: "Voting System Section Heading", name: "voting_heading", widget: "string" }
          - { label: "Voting System Intro", name: "voting_intro", widget: "text" }
          - { label: "Booklet Section Heading", name: "booklet_heading", widget: "string" }
          - { label: "Booklet Section Text", name: "booklet_text", widget: "text" }
          - { label: "Booklet Quote", name: "booklet_quote", widget: "text" }

      - label: "Sovereignty"
        name: "sovereignty"
        file: "content/sovereignty.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body Content", name: "body", widget: "markdown" }

      - label: "The Booklet"
        name: "booklet"
        file: "content/booklet.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Intro Text", name: "intro", widget: "text" }
          - { label: "What's in the Booklet (body)", name: "body", widget: "markdown" }
          - label: "Purchase Options"
            name: "purchase_options"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Price", name: "price", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
          - { label: "Bulk Order Email", name: "bulk_email", widget: "string" }
          - { label: "Donate CTA Text", name: "donate_cta", widget: "string" }

  - name: "holyrood"
    label: "Holyrood 2026"
    files:
      - label: "Overview"
        name: "elections"
        file: "content/holyrood-2026/elections.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body Content", name: "body", widget: "markdown" }

      - label: "The Second Vote"
        name: "second-vote"
        file: "content/holyrood-2026/second-vote.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Body Content", name: "body", widget: "markdown" }

      - label: "Video Explainers"
        name: "explainers"
        file: "content/holyrood-2026/explainers.md"
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Page Subtitle", name: "subtitle", widget: "string" }
          - { label: "Intro Text", name: "intro", widget: "text" }
          - { label: "YouTube Embed URL", name: "video_url", widget: "string", required: false, hint: "Paste a YouTube embed URL here e.g. https://www.youtube.com/embed/VIDEOID" }
          - { label: "Body Content", name: "body", widget: "markdown" }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "Global Settings"
        name: "settings"
        file: "content/settings.md"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Contact Email", name: "contact_email", widget: "string" }
          - { label: "Footer Description", name: "footer_description", widget: "text" }
          - { label: "Stripe Donation Link", name: "stripe_link", widget: "string", required: false }
          - { label: "Calculator External URL", name: "calculator_url", widget: "string" }
